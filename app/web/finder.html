<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Path Famous Finder · Atlas de Encuentros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./static/finder.css?v=3">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const reg of regs) reg.unregister();
      });
    }
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="./static/finder.js?v=3" defer></script>
</head>
<body data-mode="select">
  <!-- FONDO: MAPA DEL MUNDO ANTIGUO OCUPANDO TODA LA PESTAÑA (100vw x 100vh) -->
  <div id="map-stage" class="map-stage is-blurred">
    <div id="antique-map" class="antique-map" role="application" aria-label="Mapa cartográfico antiguo del mundo"></div>

    <!-- Rosa de los vientos cartográfica -->
    <div class="map-compass-rose" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="64" height="64">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#5c4b37" stroke-width="1" stroke-dasharray="2 2"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#5c4b37" stroke-width="0.75"/>
        <polygon points="50,6 56,44 50,38 44,44" fill="#184A8C"/>
        <polygon points="50,94 55,56 50,62 45,56" fill="#5c4b37"/>
        <polygon points="94,50 56,55 62,50 56,45" fill="#5c4b37"/>
        <polygon points="6,50 44,55 38,50 44,45" fill="#5c4b37"/>
        <circle cx="50" cy="50" r="4" fill="#ece2ce" stroke="#191612" stroke-width="1.2"/>
        <text x="50" y="18" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="9" font-weight="700" fill="#191612">N</text>
      </svg>
    </div>
  </div>

  <!-- PANTALLA INICIAL (SOBRE EL FONDO DIFUMINADO): SOLO 2 CUADROS (IZQUIERDA Y DERECHA) CON IMAGEN Y BUSCADOR ABAJO + DADOS Y BUSCAR -->
  <section id="selector-overlay" class="selector-overlay" aria-label="Selección de personajes">
    <div class="selector-stage">
      <div class="cards-pair">
        <!-- CUADRO IZQUIERDO: ORIGEN -->
        <div class="person-box" id="box-from">
          <div class="person-box-header">
            <span class="box-kicker">Punto de partida</span>
            <span class="origin-tag"><span class="blue-dot-inline"></span> Origen</span>
          </div>

          <div class="person-portrait-stage">
            <img id="img-select-from" src="" alt="" loading="lazy" hidden>
            <div id="mono-select-from" class="select-monogram">?</div>
            <div class="person-portrait-caption">
              <h2 id="title-select-from" class="select-person-name">Cargando...</h2>
              <span id="meta-select-from" class="select-person-meta"></span>
            </div>
          </div>

          <div class="box-search-area" id="comb-from">
            <div class="input-wrap">
              <input
                id="input-from"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Buscar primer famoso (ej. Benito Juárez, Jesús...)"
                aria-label="Buscar primer personaje famoso"
                aria-expanded="false"
                aria-controls="list-from"
              >
              <button type="button" id="clear-from" class="clear-btn" title="Limpiar búsqueda" hidden>×</button>
            </div>
            <div id="list-from" class="autocomplete-sheet" role="listbox" aria-label="Sugerencias para el origen" hidden></div>
          </div>
        </div>

        <!-- CUADRO DERECHO: DESTINO -->
        <div class="person-box" id="box-to">
          <div class="person-box-header">
            <span class="box-kicker">Punto de destino</span>
            <span class="dest-tag">Destino</span>
          </div>

          <div class="person-portrait-stage">
            <img id="img-select-to" src="" alt="" loading="lazy" hidden>
            <div id="mono-select-to" class="select-monogram">?</div>
            <div class="person-portrait-caption">
              <h2 id="title-select-to" class="select-person-name">Cargando...</h2>
              <span id="meta-select-to" class="select-person-meta"></span>
            </div>
          </div>

          <div class="box-search-area" id="comb-to">
            <div class="input-wrap">
              <input
                id="input-to"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Buscar segundo famoso (ej. Nelson Kanzela, Tesla...)"
                aria-label="Buscar segundo personaje famoso"
                aria-expanded="false"
                aria-controls="list-to"
              >
              <button type="button" id="clear-to" class="clear-btn" title="Limpiar búsqueda" hidden>×</button>
            </div>
            <div id="list-to" class="autocomplete-sheet" role="listbox" aria-label="Sugerencias para el destino" hidden></div>
          </div>
        </div>
      </div>

      <!-- CONTROLES INFERIORES: DADOS AL AZAR Y BOTÓN BUSCAR -->
      <div class="selector-Controls-bar">
        <button
          type="button"
          id="btn-dice"
          class="dice-btn"
          title="Elegir dos personajes al azar"
          aria-label="Elegir ambos personajes al azar"
        >
          <svg class="dice-svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
            <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/>
            <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/>
          </svg>
          <span>Al azar</span>
        </button>

        <button type="button" id="find-path-btn" class="search-action-btn">
          Buscar conexión
        </button>
      </div>

      <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden></div>
    </div>
  </section>

  <!-- HUD DE EXPLORACIÓN SOBRE EL MAPA PANTALLA COMPLETA -->
  <section id="hud-overlay" class="hud-overlay" aria-label="Secuencia de encuentros sobre el mapa" hidden>
    <!-- BARRA SUPERIOR: BOTÓN CAMBIAR PERSONAJES + 2 CARDS DE LOS INVOLUCRADOS ARRIBA + BOTÓN MAPA COMPLETO -->
    <header class="hud-top">
      <div class="hud-corner-left">
        <button type="button" id="btn-back-search" class="hud-util-btn" title="Volver a elegir personajes">
          ← Cambiar personajes
        </button>
        <div class="hud-route-pill" id="route-summary-pill">
          <span id="route-title">Ruta verificada</span>
          <span class="route-hops-badge" id="route-kicker"></span>
        </div>
      </div>

      <!-- 2 CARDS ARRIBA CON LOS INVOLUCRADOS EN EL ENCUENTRO ACTUAL -->
      <div class="hud-involved-pair" aria-live="polite">
        <!-- CARD INVOLUCRADO 1 -->
        <article class="involved-card" id="protagonist-from">
          <div class="involved-avatar">
            <img id="img-step-from" src="" alt="" loading="lazy">
            <div id="fallback-step-from" class="involved-monogram" hidden></div>
          </div>
          <div class="involved-info">
            <span class="involved-role" id="role-step-from">Origen del enlace</span>
            <h3 class="involved-name" id="name-step-from">—</h3>
            <span class="involved-life" id="life-step-from"></span>
          </div>
        </article>

        <!-- NEXO ENTRE AMBOS -->
        <div class="involved-nexus">
          <span class="nexus-super" id="step-supertype">Vínculo</span>
          <div class="nexus-arrow-line">
            <span class="nexus-blue-dot"></span>
            <span class="nexus-arrow-glyph">⟶</span>
          </div>
          <strong class="nexus-type" id="step-type-label">Se reunieron</strong>
          <span class="nexus-ctx" id="step-context-name" hidden></span>
        </div>

        <!-- CARD INVOLUCRADO 2 -->
        <article class="involved-card" id="protagonist-to">
          <div class="involved-avatar">
            <img id="img-step-to" src="" alt="" loading="lazy">
            <div id="fallback-step-to" class="involved-monogram" hidden></div>
          </div>
          <div class="involved-info">
            <span class="involved-role" id="role-step-to">Destino del enlace</span>
            <h3 class="involved-name" id="name-step-to">—</h3>
            <span class="involved-life" id="life-step-to"></span>
          </div>
        </article>
      </div>

      <div class="hud-corner-right">
        <button type="button" id="btn-world-view" class="hud-util-btn" title="Ver todo el recorrido en el mapa">
          Mapa completo
        </button>
      </div>
    </header>

    <!-- BARRA INFERIOR: DOS FLECHAS ABAJO Y EN MEDIO LA DESCRIPCIÓN DEL EVENTO Y FUENTES EN AZUL -->
    <footer class="hud-bottom">
      <div class="bottom-nav-console">
        <!-- FLECHA IZQUIERDA -->
        <button
          type="button"
          id="nav-prev"
          class="bottom-arrow arrow-prev"
          aria-label="Evento anterior"
          title="Evento anterior (Flecha izquierda)"
        >
          <span class="arrow-glyph" aria-hidden="true">←</span>
          <span class="arrow-label" id="prev-caption">Anterior</span>
        </button>

        <!-- DESCRIPCIÓN DEL EVENTO EN MEDIO DE LAS DOS FLECHAS -->
        <article class="event-description-card" id="encounter-card" aria-live="polite">
          <div class="event-card-header">
            <div class="event-step-meta">
              <span class="event-step-badge" id="step-badge">Encuentro I de VI</span>
              <span class="event-date-badge" id="step-date">—</span>
            </div>
            <div class="event-place-meta">
              <span class="place-pin" aria-hidden="true">📍</span>
              <strong id="step-place" class="event-place-text">—</strong>
              <span id="map-coords-readout" class="event-coords-text"></span>
            </div>
          </div>

          <p class="event-narrative" id="step-narrative"></p>

          <div class="event-sources" id="step-sources"></div>
        </article>

        <!-- FLECHA DERECHA -->
        <button
          type="button"
          id="nav-next"
          class="bottom-arrow arrow-next"
          aria-label="Siguiente evento"
          title="Siguiente evento (Flecha derecha)"
        >
          <span class="arrow-glyph" aria-hidden="true">→</span>
          <span class="arrow-label" id="next-caption">Siguiente</span>
        </button>
      </div>
    </footer>
  </section>
</body>
</html>
