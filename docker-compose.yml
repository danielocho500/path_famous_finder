services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8004:8000"
    volumes:
      - ./app:/usr/src/app
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
      - PYTHONUNBUFFERED=1
      - PREFIX
      - PROD
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - CLOUDINARY_URL
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASS
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
      - NEO4J_DATABASE
    restart: unless-stopped
